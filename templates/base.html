{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Informations lues par le navigateur, pas affichées dans la page -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Super Animaux{% endblock %}</title>
    <!-- Feuille de style commune à toutes les pages -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- ===== MENU DU HAUT ===== -->
    <header>
        <a class="logo" href="{% url 'blog:accueil' %}">Super Animaux</a>
        <nav>
            <a href="{% url 'blog:animal_list' %}">Adopter</a>
            <a href="{% url 'blog:proposer_animal' %}">Proposer un animal</a>
            <a href="{% url 'blog:comment_ca_marche' %}">Comment ça marche</a>
            <a href="{% url 'blog:about' %}">À propos</a>
            <a class="nav-admin" href="{% url 'admin:index' %}">Admin</a>
        </nav>
    </header>

    <!-- ===== CONTENU DE LA PAGE (change selon la page) ===== -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- ===== PIED DE PAGE ===== -->
    <footer>
        <div>
            <strong>Super Animaux</strong>
            <p>Des fiches simples pour les chiens et les chats à adopter.</p>
        </div>
        <nav>
            <a href="{% url 'blog:animal_list' %}?espece=chien">Chiens</a>
            <a href="{% url 'blog:animal_list' %}?espece=chat">Chats</a>
            <a href="{% url 'blog:proposer_animal' %}">Proposer un animal</a>
            <a href="{% url 'blog:comment_ca_marche' %}">Comment ça marche</a>
        </nav>
    </footer>

</body>
</html>
